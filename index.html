<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Start Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- ========== HEADER ========== -->
    <header class="header">

      <!-- Theme toggle (Challenge 1: Light/Dark mode) -->
      <button id="btn-theme" class="btn-icon" title="Toggle light / dark mode">🌙</button>

      <!-- Greeting + clock -->
      <div class="greeting-wrap">
        <h1 id="greeting">Good morning!</h1>
        <p  id="datetime"  class="datetime"></p>
      </div>

      <!-- Custom name row (Challenge 2) -->
      <div class="name-row">
        <span id="name-tag"></span>
        <button id="btn-set-name" class="btn-link">✏️ Set name</button>
      </div>

    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="grid">

      <!-- FOCUS TIMER -->
      <section class="card" id="timer-section">
        <h2 class="card-label">⏱ Focus Timer</h2>

        <div id="timer-face" class="timer-face">25:00</div>

        <!-- Challenge 3: Change Pomodoro time -->
        <div class="timer-duration">
          <label for="inp-minutes">Minutes:</label>
          <input id="inp-minutes" type="number" min="1" max="120" value="25" />
          <button id="btn-apply" class="btn btn-secondary btn-sm">Apply</button>
        </div>

        <div class="timer-controls">
          <button id="btn-start" class="btn btn-primary">Start</button>
          <button id="btn-stop"  class="btn btn-secondary">Stop</button>
          <button id="btn-reset" class="btn btn-ghost">Reset</button>
        </div>
      </section>

      <!-- TO-DO LIST -->
      <section class="card" id="todo-section">
        <h2 class="card-label">✅ To-Do List</h2>

        <div class="todo-add-row">
          <input id="inp-task" type="text" maxlength="80" placeholder="New task…" />
          <button id="btn-add-task" class="btn btn-primary">Add</button>
        </div>

        <!-- Challenge 4: Sort tasks -->
        <div class="todo-sort-row">
          <label for="sel-sort">Sort:</label>
          <select id="sel-sort">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="az">A → Z</option>
            <option value="done">Done last</option>
          </select>
        </div>

        <ul id="task-list" class="task-list"></ul>
        <p id="task-empty" class="hint">No tasks yet — add one above!</p>
      </section>

      <!-- QUICK LINKS -->
      <section class="card" id="links-section">
        <h2 class="card-label">🔗 Quick Links</h2>

        <div class="link-add-row">
          <input id="inp-link-label" type="text" maxlength="30" placeholder="Label"       />
          <input id="inp-link-url"   type="url"               placeholder="https://…"    />
          <button id="btn-add-link" class="btn btn-primary">Add</button>
        </div>

        <div id="link-grid" class="link-grid"></div>
        <p id="link-empty" class="hint">No links yet — add your favorites!</p>
      </section>

    </main>

    <!-- ========== MODALS ========== -->

    <!-- Set / edit name modal -->
    <div id="modal-name" class="modal" aria-hidden="true">
      <div class="modal-box">
        <h2>What's your name?</h2>
        <input id="inp-name" type="text" maxlength="30" placeholder="Your name…" />
        <div class="modal-footer">
          <button id="btn-name-cancel" class="btn btn-secondary">Cancel</button>
          <button id="btn-name-save"   class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>

    <!-- Edit task modal -->
    <div id="modal-edit" class="modal" aria-hidden="true">
      <div class="modal-box">
        <h2>Edit Task</h2>
        <input id="inp-edit-task" type="text" maxlength="80" />
        <div class="modal-footer">
          <button id="btn-edit-cancel" class="btn btn-secondary">Cancel</button>
          <button id="btn-edit-save"   class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
